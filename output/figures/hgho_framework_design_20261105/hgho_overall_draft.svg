<title id="title">HGHO overall framework layout draft</title>
<desc id="desc">A standalone HGHO overall framework figure. HAN encoder and PDQN controller are abbreviated modules whose internals appear in two separate figures. Raw observations bypass HAN and are fused with its user embeddings; masks enter PDQN selection; encoded replay and target networks support PDQN-only learning.</desc>
