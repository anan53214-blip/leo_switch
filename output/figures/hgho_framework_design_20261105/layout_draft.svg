<text x="52" y="68" font-size="32" text-anchor="start" font-weight="700" fill="#26313D">(a) HAN: contention representation</text><text x="842" y="68" font-size="25" text-anchor="end" font-weight="400" fill="#8B929C">Frozen</text><text x="925" y="68" font-size="32" text-anchor="start" font-weight="700" fill="#26313D">(b) PDQN: parameterized joint control</text><text x="52" y="744" font-size="32" text-anchor="start" font-weight="700" fill="#26313D">(c) HGHO: overall interaction and learning flow</text><text x="150" y="125" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">Typed graph</text><text x="150" y="158" font-size="29" text-anchor="middle" font-weight="400" fill="#26313D">Gₜ</text><text x="100" y="237" font-size="21" text-anchor="middle" font-weight="400" fill="#26313D">S</text><text x="200" y="237" font-size="21" text-anchor="middle" font-weight="400" fill="#26313D">S</text><text x="90" y="347" font-size="21" text-anchor="middle" font-weight="400" fill="#26313D">U</text><text x="205" y="347" font-size="21" text-anchor="middle" font-weight="400" fill="#26313D">U</text><text x="145" y="417" font-size="21" text-anchor="middle" font-weight="400" fill="#26313D">U</text><text x="150" y="462" font-size="24" text-anchor="middle" font-weight="400" fill="#26313D">Node / edge</text><text x="150" y="490" font-size="24" text-anchor="middle" font-weight="400" fill="#26313D">features</text><text x="563" y="132" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">HAN layer  × 2</text><text x="442.0" y="192.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">U–S–U  (serving)</text><text x="442.0" y="223.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Established contention</text><text x="442.0" y="300.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">U–S–U  (visibility)</text><text x="442.0" y="331.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Potential contention</text><text x="442.0" y="407.32" font-size="23" text-anchor="middle" font-weight="400" fill="#26313D">U–U; S–U–S; S–S–S</text><text x="442.0" y="438.32" font-size="23" text-anchor="middle" font-weight="400" fill="#26313D">Other relational context</text><text x="716.0" y="220.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Per-path</text><text x="716.0" y="251.0" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">node attention α</text><text x="716.0" y="385.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Type-wise</text><text x="716.0" y="416.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">semantic</text><text x="716.0" y="447.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">attention β</text><text x="716.0" y="595.5" font-size="25" text-anchor="middle" font-weight="700" fill="#26313D">User embedding zᵢ(t)</text><text x="73" y="555" font-size="24" text-anchor="start" font-weight="400" fill="#26313D">User and satellite representations</text><text x="73" y="585" font-size="24" text-anchor="start" font-weight="400" fill="#26313D">are propagated across layers.</text><text x="73" y="631" font-size="22" text-anchor="start" font-weight="400" fill="#485461">Serving: solid     Visibility: dashed</text><text x="1000.0" y="184.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Fused obs.</text><text x="1000.0" y="215.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">õᵢ(t)</text><text x="1250.0" y="165.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Parameter branches μψ</text><text x="1250.0" y="196.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">One fraction per action</text><text x="1575.0" y="182.2" font-size="30" text-anchor="middle" font-weight="400" fill="#26313D">ρ̂ᵢ,₀  …  ρ̂ᵢ,K</text><text x="1000.0" y="378.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Index j</text><text x="1000.0" y="409.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">(one-hot)</text><text x="1250.0" y="363.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Shared Q-network Qθ</text><text x="1250.0" y="394.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Input: (õᵢ, j, ρ̂ᵢ,j)</text><text x="1575.0" y="381.2" font-size="30" text-anchor="middle" font-weight="400" fill="#26313D">qᵢ,₀  …  qᵢ,K</text><text x="1000.0" y="551.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Mask mᵢ</text><text x="1250.0" y="537.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">Masked argmax</text><text x="1250.0" y="568.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">+ matching fraction</text><text x="1575.0" y="556.2" font-size="30" text-anchor="middle" font-weight="700" fill="#26313D">aᵢ = (dᵢ*, ρ̂ᵢ)</text><text x="1430" y="258" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Pair (j, ρ̂ᵢ,j)</text><text x="935" y="633" font-size="26" text-anchor="start" font-weight="400" fill="#26313D">Shared parameters across users i = 1, …, N</text><text x="175.0" y="917.54" font-size="31" text-anchor="middle" font-weight="700" fill="#26313D">LEO-MEC</text><text x="175.0" y="948.54" font-size="31" text-anchor="middle" font-weight="700" fill="#26313D">environment</text><text x="460.0" y="898.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">Graph construction</text><text x="460.0" y="929.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">Gₜ</text><text x="710.0" y="899.36" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">HAN (a)</text><text x="710.0" y="930.36" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">Frozen</text><text x="955.0" y="899.02" font-size="28" text-anchor="middle" font-weight="400" fill="#26313D">Concat</text><text x="955.0" y="930.02" font-size="28" text-anchor="middle" font-weight="400" fill="#26313D">õᵢ = [oᵢ ∥ zᵢ]</text><text x="1220.0" y="898.68" font-size="27" text-anchor="middle" font-weight="700" fill="#26313D">PDQN (b)</text><text x="1220.0" y="929.68" font-size="27" text-anchor="middle" font-weight="700" fill="#26313D">Shared over users</text><text x="1540.0" y="899.36" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">Joint requests Aₜ</text><text x="1540.0" y="930.36" font-size="29" text-anchor="middle" font-weight="700" fill="#26313D">Handover + fraction</text><text x="821" y="886" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">zᵢ</text><text x="950" y="790" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Execute joint requests and advance the environment</text><text x="610" y="1008" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Raw observations oᵢ: user, task, candidates</text><text x="930" y="1053" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Feasible-action mask mᵢ</text><text x="372" y="1155" font-size="26" text-anchor="start" font-weight="700" fill="#485461">Training only</text><text x="580.0" y="1224.86" font-size="29" text-anchor="middle" font-weight="400" fill="#26313D">Encoded replay D</text><text x="1075.0" y="1224.86" font-size="29" text-anchor="middle" font-weight="400" fill="#26313D">PDQN learner: L_Q and L_μ</text><text x="1545.0" y="1224.52" font-size="28" text-anchor="middle" font-weight="400" fill="#26313D">Target networks</text><text x="260" y="1127" font-size="25" text-anchor="middle" font-weight="400" fill="#485461">Collect</text><text x="260" y="1158" font-size="25" text-anchor="middle" font-weight="400" fill="#485461">transitions</text><text x="806" y="1201" font-size="23" text-anchor="middle" font-weight="400" fill="#485461">sample</text><text x="1355" y="1200" font-size="23" text-anchor="middle" font-weight="400" fill="#485461">copy</text><text x="1320" y="1283" font-size="21" text-anchor="middle" font-weight="400" fill="#485461">TD targets</text><text x="1430" y="1105" font-size="25" text-anchor="middle" font-weight="400" fill="#485461">Update θ and ψ only</text>
