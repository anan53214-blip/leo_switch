<title id="title">HGHO three-panel figure layout draft</title>
<desc id="desc">Two module detail panels, HAN and PDQN, above a shared overall pipeline with encoded experience replay and a separate training lane. Green HAN is frozen; only PDQN is updated. Colors are drawn from the user's reference pictures.</desc>
