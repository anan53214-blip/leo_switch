<text x="925" y="68" font-size="32" text-anchor="start" font-weight="700" fill="#26313D">PDQN controller: parameterized joint control</text><text x="1000.0" y="184.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Fused obs.</text><text x="1000.0" y="215.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">õᵢ(t)</text><text x="1250.0" y="165.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Parameter branches μψ</text><text x="1250.0" y="196.34" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">One fraction per action</text><text x="1575.0" y="182.2" font-size="30" text-anchor="middle" font-weight="400" fill="#26313D">ρ̂ᵢ,₀  …  ρ̂ᵢ,K</text><text x="1000.0" y="378.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Index j</text><text x="1000.0" y="409.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">(one-hot)</text><text x="1250.0" y="363.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Shared Q-network Qθ</text><text x="1250.0" y="394.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Input: (õᵢ, j, ρ̂ᵢ,j)</text><text x="1575.0" y="381.2" font-size="30" text-anchor="middle" font-weight="400" fill="#26313D">qᵢ,₀  …  qᵢ,K</text><text x="1000.0" y="551.84" font-size="26" text-anchor="middle" font-weight="400" fill="#26313D">Mask mᵢ</text><text x="1250.0" y="537.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">Masked argmax</text><text x="1250.0" y="568.68" font-size="27" text-anchor="middle" font-weight="400" fill="#26313D">+ matching fraction</text><text x="1575.0" y="556.2" font-size="30" text-anchor="middle" font-weight="700" fill="#26313D">aᵢ = (dᵢ*, ρ̂ᵢ)</text><text x="1430" y="258" font-size="25" text-anchor="middle" font-weight="400" fill="#26313D">Pair (j, ρ̂ᵢ,j)</text><text x="935" y="633" font-size="26" text-anchor="start" font-weight="400" fill="#26313D">Shared parameters across users i = 1, …, N</text>
</g>
