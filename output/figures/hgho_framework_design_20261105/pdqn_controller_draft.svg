<svg xmlns="http://www.w3.org/2000/svg" width="890" height="665" viewBox="890 15 890 665" role="img" aria-labelledby="title desc">
<title id="title">PDQN controller layout draft</title>
<desc id="desc">A standalone PDQN module figure: fused observations enter both the parameter branches and a shared Q-network. Candidate index-fraction pairs are evaluated, masked argmax selects an index, and the corresponding fraction is gathered. Parameters are shared across users.</desc>
<defs>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#485461"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#EC7C30"/></marker>
</defs>
<rect x="890" y="15" width="890" height="665" fill="white"/>
<g font-family="Times New Roman, Times, serif">
<rect x="900" y="25" width="870" height="645" rx="0" fill="white" stroke="#9D84B5" stroke-width="1.4"/>
