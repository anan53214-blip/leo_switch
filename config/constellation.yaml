# Walker星座配置参数
# 参考论文：星地融合网络中基于异质图表征的多智能体协作切换方法

constellation:
  name: "LEO_Walker"
  
  # 轨道参数
  orbital:
    num_planes: 6           # 轨道平面数 (P)
    sats_per_plane: 11      # 每轨道卫星数 (S)，总共66颗卫星
    altitude_km: 550        # 轨道高度 (km)
    inclination_deg: 53.0   # 轨道倾角 (度)
    
  # 相位参数
  phase:
    phase_factor: 1         # Walker相位因子 (F)
    # 相位差 = F * 360 / (P * S)
    
  # 卫星参数  
  satellite:
    antenna_gain_db: 30.0   # 天线增益 (dB)
    tx_power_dbm: 40.0      # 发射功率 (dBm)
    min_elevation_deg: 10.0 # 最小仰角 (度)
    
  # MEC计算参数
  mec:
    cpu_frequency_ghz: 10.0 # CPU频率 (GHz)
    max_queue_size: 100     # 最大任务队列长度
    
# 仿真参数
simulation:
  start_time: "2026-01-15T00:00:00"  # 仿真开始时间
  duration_minutes: 60               # 仿真时长 (分钟)
  time_step_seconds: 1.0             # 时间步长 (秒)
  
# 地面区域参数
ground:
  center_lat: 39.9         # 区域中心纬度 (北京)
  center_lon: 116.4        # 区域中心经度
  radius_km: 100           # 区域半径 (km)